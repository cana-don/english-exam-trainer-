<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Exam Trainer</title><!-- pages redeploy --><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f4f1e9;color:#17202a}*{box-sizing:border-box}body{margin:0}.page{max-width:820px;margin:auto;padding:28px 16px}.tag{display:inline-block;background:#d9f2f0;color:#08737a;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}h1{font-size:clamp(34px,7vw,56px);line-height:1;margin:18px 0 10px}header p{color:#687178}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.box,.card,.weak,nav{background:white;border:1px solid #e4ded2;border-radius:18px;box-shadow:0 8px 28px #0000000a}.box{padding:14px}.box b{font-size:24px;display:block}.box span{font-size:11px;color:#737b80}nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;margin:14px 0}button{border:0;border-radius:11px;padding:11px 14px;font-weight:750;background:#ebe8e1}.active,.primary{background:#0d8e96;color:white}.card{padding:26px}.card small{color:#747b80;font-weight:800;letter-spacing:.1em}.card h2{font-size:clamp(30px,7vw,50px);margin:20px 0}input{width:100%;border:2px solid #e2ddd3;border-radius:13px;padding:15px;font-size:20px;outline:none}.feedback{min-height:50px;padding:14px 2px;font-weight:800}.good{color:#16834a}.bad{color:#bd3535}.actions{display:flex;gap:8px}.weak{padding:20px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:9px 0;border-top:1px solid #eee9df}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.card{padding:20px}}</style></head><body><main class="page"><header><div class="tag">FILE 1 · VOCABULARY</div><h1>English Exam Trainer</h1><p>Nur einzelne Wörter: Englisch ↔ Deutsch aus der 1. und letzten Spalte.</p></header><section class="stats"><div class="box"><b id="score">0%</b><span>Trefferquote</span></div><div class="box"><b id="right">0</b><span>Richtig</span></div><div class="box"><b id="wrong">0</b><span>Fehler</span></div><div class="box"><b>82</b><span>Vokabeln</span></div></section><nav><div style="width:100%"><small style="font-weight:800;color:#747b80">RICHTUNG</small><div id="directionNav" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:7px"></div></div><div style="width:100%;margin-top:8px"><small style="font-weight:800;color:#747b80">AUSWAHL</small><div id="filterNav" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:7px"></div></div></nav><section class="card"><small id="dir"></small><h2 id="q"></h2><input id="a" autocomplete="off" autocapitalize="none" placeholder="Antwort eingeben …"><div id="fb" class="feedback"></div><div class="actions"><button id="check" class="primary">Prüfen ↵</button><button id="show">Lösung zeigen</button></div></section><section class="weak"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3 style="margin-bottom:4px">Problemwörter</h3><small>Nach 3 richtigen Antworten in Folge gilt ein Problemwort wieder als gelernt.</small></div><button id="reset">Alles auf 0 setzen</button></div><div id="weak" style="margin-top:12px"></div></section></main><script>
const vocab=[["attractive","attraktiv"],["bald","glatzköpfig"],["beard","Bart"],["beautiful","schön"],["big","groß"],["blonde","blond"],["blue","blau"],["clever","klug"],["curly","lockig"],["extrovert","Extrovertierte / Extrovertierter"],["fat","dick"],["friendly","freundlich"],["funny","lustig"],["generous","großzügig"],["good-looking","gut aussehend"],["handsome","hübsch"],["hard-working","fleißig"],["height","Körpergröße"],["kind","lieb"],["lazy","faul"],["long","lang"],["mean","gemein"],["moustache","Schnurrbart"],["overweight","übergewichtig"],["quiet","ruhig"],["red","rot"],["serious","ernst"],["short","klein"],["shy","schüchtern"],["slim","schlank"],["straight","glatt"],["stupid","dumm"],["talkative","gesprächig"],["tall","groß"],["thin","dünn"],["unfriendly","unfreundlich"],["unkind","unfreundlich"],["belt","Gürtel"],["blouse","Bluse"],["boots","Stiefel"],["bracelet","Armband"],["cap","Mütze"],["cardigan","Strickjacke"],["carry","tragen"],["coat","Mantel"],["dress (noun)","Kleid"],["dress (verb)","anziehen"],["earrings","Ohrringe"],["flip-flops","Flip-Flops"],["gloves","Handschuhe"],["hat","Hut"],["jacket","Jacke"],["jeans","Jeans"],["leggings","Leggings"],["necklace","Halskette"],["pyjamas","Schlafanzug"],["ring","Ring"],["sandals","Sandalen"],["scarf","Schal"],["shirt","Hemd"],["shoes","Schuhe"],["shorts","Shorts"],["skirt","Rock"],["socks","Socken"],["suit","Anzug"],["sweater","Pullover"],["tie","Krawatte"],["tights","Strumpfhose"],["top","Oberteil"],["tracksuit","Trainingsanzug"],["trainers","Trainingsschuhe"],["trousers","Hose"],["T-shirt","T-Shirt"],["underwear","Unterwäsche"],["wear","tragen"],["above","über"],["behind","hinter"],["between","zwischen"],["in","in"],["on","auf"],["under","unter"],["fun","lustig"]];let directionMode='en-de',filterMode='all',current=0,dir='en-de',done=false;let stats=JSON.parse(localStorage.getItem('vocab-stats')||'{"right":0,"wrong":0,"errors":{},"streaks":{}}');stats.errors=stats.errors||{};stats.streaks=stats.streaks||{};const $=x=>document.getElementById(x);const norm=s=>s.toLowerCase().trim().replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.!?]/g,'');function save(){localStorage.setItem('vocab-stats',JSON.stringify(stats));update()}function next(){let pool=vocab.map((_,i)=>i);if(filterMode==='weak'){pool=pool.filter(i=>(stats.errors[vocab[i][0]]||0)>0);if(!pool.length){done=true;$('q').textContent='Keine Problemwörter 🎉';$('dir').textContent='NUR FEHLER';$('a').value='';$('a').disabled=true;$('fb').textContent='Mach zuerst im Modus „Alle Wörter“ weiter. Neue Fehler erscheinen danach hier.';$('fb').className='feedback good';$('check').textContent='Keine Fehler';return}}$('a').disabled=false;let w=filterMode==='weak'?pool:pool.flatMap(i=>Array(1+(stats.errors[vocab[i][0]]||0)*2).fill(i));current=w[Math.floor(Math.random()*w.length)];dir=directionMode==='mixed'?(Math.random()<.5?'en-de':'de-en'):directionMode;done=false;$('a').value='';$('fb').textContent='';$('fb').className='feedback';$('dir').textContent=(dir==='en-de'?'ÜBERSETZE INS DEUTSCHE':'ÜBERSETZE INS ENGLISCHE')+(filterMode==='weak'?' · NUR FEHLER':'');$('q').textContent=dir==='en-de'?vocab[current][0]:vocab[current][1];$('check').textContent='Prüfen ↵';$('a').focus()}function check(){if(done){next();return}if(!$('a').value.trim())return;let key=vocab[current][0],target=dir==='en-de'?vocab[current][1]:key,ok=target.split('/').map(norm).includes(norm($('a').value));if(ok){stats.right++;if((stats.errors[key]||0)>0){stats.streaks[key]=(stats.streaks[key]||0)+1;if(stats.streaks[key]>=3){stats.errors[key]=0;stats.streaks[key]=0;$('fb').textContent='🏆 3× hintereinander richtig! „'+key+'“ ist kein Problemwort mehr.'}else{$('fb').textContent='✓ Richtig! Problemwort '+stats.streaks[key]+'/3'}}else{$('fb').textContent='✓ Richtig!'}$('fb').className='feedback good'}else{stats.wrong++;stats.errors[key]=(stats.errors[key]||0)+1;stats.streaks[key]=0;$('fb').textContent='✗ Richtig ist: '+target+' · Serie zurück auf 0/3';$('fb').className='feedback bad'}done=true;$('check').textContent='Nächste →';save()}function show(){if(done)return;let target=dir==='en-de'?vocab[current][1]:vocab[current][0];stats.wrong++;stats.errors[vocab[current][0]]=(stats.errors[vocab[current][0]]||0)+1;stats.streaks[vocab[current][0]]=0;$('fb').textContent='Richtig ist: '+target;done=true;$('check').textContent='Nächste →';save()}function update(){let t=stats.right+stats.wrong;$('score').textContent=(t?Math.round(stats.right/t*100):0)+'%';$('right').textContent=stats.right;$('wrong').textContent=stats.wrong;let w=vocab.filter(v=>(stats.errors[v[0]]||0)>0).sort((a,b)=>stats.errors[b[0]]-stats.errors[a[0]]).slice(0,7);$('weak').innerHTML=w.length?w.map(v=>'<div class="row"><span>'+v[0]+'</span><span>'+v[1]+'</span><b>'+((stats.streaks[v[0]]||0))+'/3 ✓</b></div>').join(''):'Noch keine Problemwörter 🎉'}[['en-de','EN → DE'],['de-en','DE → EN'],['mixed','Gemischt']].forEach(([m,l])=>{let b=document.createElement('button');b.textContent=l;b.className=m===directionMode?'active':'';b.onclick=()=>{directionMode=m;[...$('directionNav').children].forEach(x=>x.className='');b.className='active';next()};$('directionNav').appendChild(b)});[['all','Alle Wörter'],['weak','Nur Fehler']].forEach(([m,l])=>{let b=document.createElement('button');b.textContent=l;b.className=m===filterMode?'active':'';b.onclick=()=>{filterMode=m;[...$('filterNav').children].forEach(x=>x.className='');b.className='active';next()};$('filterNav').appendChild(b)});$('check').onclick=check;$('show').onclick=show;$('a').onkeydown=e=>{if(e.key==='Enter')check()};$('reset').onclick=()=>{if(confirm('Wirklich den gesamten Lernfortschritt auf 0 setzen? Richtig, Fehler und alle Problemwörter werden gelöscht.')){stats={right:0,wrong:0,errors:{},streaks:{}};save();next()}};update();next();
</script></body></html>
