<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Exam Trainer</title><!-- pages redeploy --><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f4f1e9;color:#17202a}*{box-sizing:border-box}body{margin:0}.page{max-width:820px;margin:auto;padding:28px 16px}.tag{display:inline-block;background:#d9f2f0;color:#08737a;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}h1{font-size:clamp(34px,7vw,56px);line-height:1;margin:18px 0 10px}header p{color:#687178}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.box,.card,.weak,nav{background:white;border:1px solid #e4ded2;border-radius:18px;box-shadow:0 8px 28px #0000000a}.box{padding:14px}.box b{font-size:24px;display:block}.box span{font-size:11px;color:#737b80}nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;margin:14px 0}button{border:0;border-radius:11px;padding:11px 14px;font-weight:750;background:#ebe8e1}.active,.primary{background:#0d8e96;color:white}.card{padding:26px}.card small{color:#747b80;font-weight:800;letter-spacing:.1em}.card h2{font-size:clamp(30px,7vw,50px);margin:20px 0}input{width:100%;border:2px solid #e2ddd3;border-radius:13px;padding:15px;font-size:20px;outline:none}.feedback{min-height:50px;padding:14px 2px;font-weight:800}.good{color:#16834a}.bad{color:#bd3535}.actions{display:flex;gap:8px}.weak{padding:20px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:9px 0;border-top:1px solid #eee9df}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.card{padding:20px}}</style></head><body><main class="page"><header><div class="tag">FILE 1 · VOCABULARY</div><h1>English Exam Trainer</h1><p>Nur Englisch ↔ Deutsch aus der 1. und letzten Spalte deiner Vokabelblätter.</p></header><section class="stats"><div class="box"><b id="score">0%</b><span>Trefferquote</span></div><div class="box"><b id="right">0</b><span>Richtig</span></div><div class="box"><b id="wrong">0</b><span>Fehler</span></div><div class="box"><b>87</b><span>Vokabeln</span></div></section><nav id="nav"></nav><section class="card"><small id="dir"></small><h2 id="q"></h2><input id="a" autocomplete="off" autocapitalize="none" placeholder="Antwort eingeben …"><div id="fb" class="feedback"></div><div class="actions"><button id="check" class="primary">Prüfen ↵</button><button id="show">Lösung zeigen</button></div></section><section class="weak"><h3>Problemwörter</h3><div id="weak"></div></section></main><script>
const vocab=[["attractive","attraktiv"],["bald","glatzköpfig"],["beard","Bart"],["beautiful","schön"],["big","groß"],["blonde","blond"],["blue","blau"],["clever","klug"],["curly","lockig"],["extrovert","Extrovertierte / Extrovertierter"],["fat","dick"],["friendly","freundlich"],["funny","lustig"],["generous","großzügig"],["good-looking","gut aussehend"],["handsome","hübsch"],["hard-working","fleißig"],["height","Körpergröße"],["kind","lieb"],["lazy","faul"],["long","lang"],["mean","gemein"],["moustache","Schnurrbart"],["overweight","übergewichtig"],["quiet","ruhig"],["red","rot"],["serious","ernst"],["short","klein"],["shy","schüchtern"],["slim","schlank"],["straight","glatt"],["stupid","dumm"],["talkative","gesprächig"],["tall","groß"],["thin","dünn"],["unfriendly","unfreundlich"],["unkind","unfreundlich"],["belt","Gürtel"],["blouse","Bluse"],["boots","Stiefel"],["bracelet","Armband"],["cap","Mütze"],["cardigan","Strickjacke"],["carry","tragen"],["coat","Mantel"],["dress (noun)","Kleid"],["dress (verb)","anziehen"],["earrings","Ohrringe"],["flip-flops","Flip-Flops"],["gloves","Handschuhe"],["hat","Hut"],["jacket","Jacke"],["jeans","Jeans"],["leggings","Leggings"],["necklace","Halskette"],["pyjamas","Schlafanzug"],["ring","Ring"],["sandals","Sandalen"],["scarf","Schal"],["shirt","Hemd"],["shoes","Schuhe"],["shorts","Shorts"],["skirt","Rock"],["socks","Socken"],["suit","Anzug"],["sweater","Pullover"],["tie","Krawatte"],["tights","Strumpfhose"],["top","Oberteil"],["tracksuit","Trainingsanzug"],["trainers","Trainingsschuhe"],["trousers","Hose"],["T-shirt","T-Shirt"],["underwear","Unterwäsche"],["wear","tragen"],["above","über"],["behind","hinter"],["between","zwischen"],["in","in"],["in front of","vor"],["in the corner","in der Ecke"],["in the middle of","in der Mitte von"],["next to","neben"],["on","auf"],["on the left of","links von"],["under","unter"],["fun","lustig"]];let mode='en-de',current=0,dir='en-de',done=false;let stats=JSON.parse(localStorage.getItem('vocab-stats')||'{"right":0,"wrong":0,"errors":{}}');const $=x=>document.getElementById(x);const norm=s=>s.toLowerCase().trim().replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.!?]/g,'');function save(){localStorage.setItem('vocab-stats',JSON.stringify(stats));update()}function next(){let pool=vocab.map((_,i)=>i);if(mode==='weak'){let p=pool.filter(i=>(stats.errors[vocab[i][0]]||0)>0);if(p.length)pool=p}let w=pool.flatMap(i=>Array(1+(stats.errors[vocab[i][0]]||0)*2).fill(i));current=w[Math.floor(Math.random()*w.length)];dir=(mode==='mixed'||mode==='weak')?(Math.random()<.5?'en-de':'de-en'):mode;done=false;$('a').value='';$('fb').textContent='';$('fb').className='feedback';$('dir').textContent=dir==='en-de'?'ÜBERSETZE INS DEUTSCHE':'ÜBERSETZE INS ENGLISCHE';$('q').textContent=dir==='en-de'?vocab[current][0]:vocab[current][1];$('check').textContent='Prüfen ↵';$('a').focus()}function check(){if(done){next();return}if(!$('a').value.trim())return;let target=dir==='en-de'?vocab[current][1]:vocab[current][0],ok=target.split('/').map(norm).includes(norm($('a').value));if(ok){stats.right++;stats.errors[vocab[current][0]]=Math.max(0,(stats.errors[vocab[current][0]]||0)-1);$('fb').textContent='✓ Richtig!';$('fb').className='feedback good'}else{stats.wrong++;stats.errors[vocab[current][0]]=(stats.errors[vocab[current][0]]||0)+1;$('fb').textContent='✗ Richtig ist: '+target;$('fb').className='feedback bad'}done=true;$('check').textContent='Nächste →';save()}function show(){if(done)return;let target=dir==='en-de'?vocab[current][1]:vocab[current][0];stats.wrong++;stats.errors[vocab[current][0]]=(stats.errors[vocab[current][0]]||0)+1;$('fb').textContent='Richtig ist: '+target;done=true;$('check').textContent='Nächste →';save()}function update(){let t=stats.right+stats.wrong;$('score').textContent=(t?Math.round(stats.right/t*100):0)+'%';$('right').textContent=stats.right;$('wrong').textContent=stats.wrong;let w=vocab.filter(v=>(stats.errors[v[0]]||0)>0).sort((a,b)=>stats.errors[b[0]]-stats.errors[a[0]]).slice(0,7);$('weak').innerHTML=w.length?w.map(v=>'<div class="row"><span>'+v[0]+'</span><span>'+v[1]+'</span><b>'+stats.errors[v[0]]+'×</b></div>').join(''):'Noch keine Problemwörter 🎉'}[['en-de','EN → DE'],['de-en','DE → EN'],['mixed','Gemischt'],['weak','Nur Fehler']].forEach(([m,l])=>{let b=document.createElement('button');b.textContent=l;b.className=m===mode?'active':'';b.onclick=()=>{mode=m;[...$('nav').children].forEach(x=>x.className='');b.className='active';next()};$('nav').appendChild(b)});$('check').onclick=check;$('show').onclick=show;$('a').onkeydown=e=>{if(e.key==='Enter')check()};update();next();
</script></body></html>
